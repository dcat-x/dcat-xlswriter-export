name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        include:
          - php: 8.2
            laravel: 12
            testbench: 10
          - php: 8.3
            laravel: 12
            testbench: 10
          - php: 8.3
            laravel: 13
            testbench: 11
          - php: 8.4
            laravel: 12
            testbench: 10
          - php: 8.4
            laravel: 13
            testbench: 11

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip
          coverage: none

      - name: Install dependencies
        env:
          LARAVEL_VERSION: ${{ matrix.laravel }}
          TESTBENCH_VERSION: ${{ matrix.testbench }}
        run: |
          composer require \
            "laravel/framework:^${LARAVEL_VERSION}.0" \
            "orchestra/testbench:^${TESTBENCH_VERSION}.0" \
            --no-update --no-interaction
          composer update --prefer-dist --no-interaction --no-progress --ignore-platform-req=ext-xlswriter

      - name: Execute tests
        run: composer test
